<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Open Bible and glass on a dark table</title>
  <desc id="desc">A branded visual for Scripts and Spirits with parchment pages, antique gold arcs, a tumbler, and garnet accents.</desc>
  <defs>
