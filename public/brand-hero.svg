    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0c77a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#bd8743" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageLeft" x1="0" x2="1" y1="0" y2="1">
